<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102846">
    <meta name="description" content="Reset your Pacific Realty Solutions LTD account password.">
    <title>Reset password — Pacific Realty Solutions LTD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="auth-page">
    <header class="auth-header">
      <a class="brand" href="index.html" aria-label="Pacific Realty Solutions LTD home">
        <span class="brand-name">Pacific Realty <span>Solutions LTD</span></span>
        <img class="brand-logo" src="assets/pacific-realty-logo.png" alt="">
      </a>
      <a class="auth-back-link" href="sign-in.html">← Back to sign in</a>
    </header>
    <main class="auth-main">
      <section class="auth-card" aria-labelledby="reset-title">
        <div class="auth-logo-lockup"><img src="assets/pacific-realty-logo.png" alt="Pacific Realty Solutions LTD"></div>
        <p class="eyebrow auth-eyebrow">ACCOUNT ACCESS</p>
        <div id="password-reset-request">
          <h1 id="reset-title">Reset your password</h1>
          <p class="auth-intro">Enter your account email and we’ll send a secure reset link.</p>
          <form class="auth-form" data-auth-form="password-reset">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
            <button class="auth-submit" type="submit">Send reset link</button>
          </form>
        </div>
        <div id="password-reset-update" hidden>
          <h1>Choose a new password</h1>
          <p class="auth-intro">Use at least 8 characters for your new password.</p>
          <form class="auth-form" data-auth-form="password-update">
            <label for="password">New password</label>
            <div class="password-input-wrap"><input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8"><button data-toggle-password="#password" type="button" aria-label="Show password" aria-pressed="false">Show</button></div>
            <button class="auth-submit" type="submit">Update password</button>
          </form>
        </div>
        <p class="auth-message" id="auth-message" role="alert" hidden></p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
